name: Publicar versión

# Al subir una etiqueta v* (p. ej. v0.6.0) se compilan el instalador de Windows y la web app, y se crea un
# borrador de release con ambos. A mano (pestaña Actions) solo compila y deja los dos como artefactos.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar el instalador
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -qr ../gastopolis-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: gastopolis-web.zip

  release:
    needs: [windows, web]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Crear el borrador de release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.md <<'NOTAS'
          **Windows:** descarga `Gastopolis_*_x64-setup.exe` e instálalo (no pide permisos de administrador).
          Como el instalador no está firmado, Windows avisará la primera vez: «Más información» → «Ejecutar de todas formas».

          **iPhone:** `gastopolis-web.zip` es la web app para el alojamiento estático; en el iPhone se abre en Safari → Compartir → «Añadir a pantalla de inicio».

          Tus datos no viajan en ninguna actualización: se quedan en tu dispositivo.
          NOTAS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Gastópolis $GITHUB_REF_NAME" --notes-file notas.md *.exe gastopolis-web.zip
